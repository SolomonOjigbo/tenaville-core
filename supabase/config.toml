# Local Supabase stack. Project-linked settings live in the Supabase dashboard;
# this file configures the local development stack only.
project_id = "tenaville"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
# Listed explicitly rather than included from a single seed.sql with psql's
# \ir: the CLI sends the seed as a batch over the wire, where meta-commands are
# a syntax error. Order matters — plans before the organisations that reference
# them.
enabled = true
sql_paths = ["./seed/02_demo_organisations.sql"]

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[local_smtp]
# Local mail catcher — invitations and recovery emails land here in development.
# (Was [inbucket]; renamed in Supabase CLI v2.)
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

# Buckets are declared here rather than inserted by a migration: they are
# configuration, and the CLI creates them on `supabase start` and `db reset`.
#
# Every bucket is private. There is no public bucket and there must never be
# one — a public bucket is a guessable URL by definition (DOC-7, PROP-9).

[storage.buckets.documents]
# Leases, receipts, statements, landlord and tenant paperwork.
public = false
file_size_limit = "20MiB"
allowed_mime_types = ["application/pdf", "image/jpeg", "image/png", "image/webp"]
objects_path = "./storage/documents"

[storage.buckets.maintenance]
# Repair photos and deposit-deduction evidence. Larger, because a caretaker
# photographs a cracked basin on a phone and the compression happens client
# side (MOB-7, TV-060).
public = false
file_size_limit = "25MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp", "image/heic"]
objects_path = "./storage/maintenance"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

[auth.sms]
# Phone verification — PRD ORG-2 allows verified email and/or phone.
enable_signup = false
enable_confirmations = false

[analytics]
enabled = false
