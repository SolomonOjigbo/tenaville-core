name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  tenant-isolation:
    name: Cross-tenant isolation tests
    # PRD §16.2: "Automated cross-tenant isolation tests pass in CI on every release."
    # This job is required and must never be made optional.
    runs-on: ubuntu-latest
    services:
      postgres:
        # Supabase's own Postgres image, from Docker Hub rather than ECR Public.
        # `supabase start` pulls from public.ecr.aws, where anonymous pulls hit
        # "Data limit exceeded" and made this required job intermittently red.
        # This image carries the extensions the schema needs (plpgsql_check for
        # `db lint`, pgtap for the policy tests) which stock postgres lacks.
        # The isolation tests need a database, not the whole local stack.
        image: supabase/postgres:17.6.1.121
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      # sslmode=disable is required: the Supabase CLI will not fall back from
      # TLS, and the service container does not offer it. psql falls back
      # silently, which is why migrations passed while db lint did not.
      SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Prepare database
        # The image creates pg_graphql's event triggers during init but does not
        # always install the extension, leaving them referencing
        # graphql.increment_schema_version(). Arbitrary DDL then fails with
        # "could not open relation with OID". Installing it repairs the
        # dependency and matches hosted Supabase.
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -c 'create extension if not exists pg_graphql;'

      - name: Apply migrations
        run: |
          shopt -s nullglob
          for f in supabase/migrations/*.sql; do
            echo "applying $f"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Lint schema
        # Scoped to the schemas we own, and deliberately run BEFORE the pgTAP
        # step: `db lint` checks every function in the database, and pgTAP's own
        # functions carry dozens of warnings, so linting after installing it
        # would fail the build on third-party code.
        run: >-
          pnpm exec supabase db lint --db-url "$SUPABASE_DB_URL"
          --schema public,app --level warning --fail-on warning

      - name: Policy tests
        run: |
          shopt -s nullglob
          tests=(supabase/tests/*_test.sql)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "no pgTAP tests yet"; exit 0
          fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -c 'create extension if not exists pgtap;'
          for f in supabase/tests/*helpers*.sql; do
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
          failed=0
          for f in "${tests[@]}"; do
            echo "-- $(basename "$f")"
            if ! out="$(psql "$SUPABASE_DB_URL" -t -v ON_ERROR_STOP=1 -f "$f" 2>&1)"; then
              failed=1
            fi
            echo "$out" | grep -E '^\s*(ok |not ok|# |1\.\.)' || true
            # A pgTAP file can exit 0 while individual assertions fail.
            if echo "$out" | grep -qE 'not ok|Looks like you failed|Looks like you planned'; then failed=1; fi
            if echo "$out" | grep -qE '^psql:|ERROR:'; then
              echo "$out" | grep -E '^psql:|ERROR:' | head -5
              failed=1
            fi
          done
          exit "$failed"

  traceability:
    name: PRD requirement traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node tools/check-traceability.mjs
